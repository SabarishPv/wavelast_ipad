# XcodeGen spec. The Xcode project is generated from this file in CI
# (`xcodegen generate`), so project settings stay reviewable as plain text.
name: WaveLast

options:
  bundleIdPrefix: io.github.sabarishpv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"          # iPad only
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Signing is decided per build in CI (see .github/workflows/ipad-build.yml).
    # No team, certificate or profile is stored in the repository.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ANALYZER_NONNULL: YES

packages:
  WaveLastKit:
    path: Packages/WaveLastKit

targets:
  WaveLast:
    type: application
    platform: iOS
    sources:
      - path: App/WaveLast
        excludes:
          - "Info.plist"
    dependencies:
      - package: WaveLastKit
        product: WaveLastCore
      - package: WaveLastKit
        product: WaveLastPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sabarishpv.wavelast
        PRODUCT_NAME: WaveLast
        INFOPLIST_FILE: App/WaveLast/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO

  WaveLastTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/WaveLastTests]
    dependencies:
      - target: WaveLast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sabarishpv.wavelast.tests
        GENERATE_INFOPLIST_FILE: YES
        # TEST_HOST / BUNDLE_LOADER are set by XcodeGen from the WaveLast dependency.

  WaveLastUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/WaveLastUITests]
    dependencies:
      - target: WaveLast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sabarishpv.wavelast.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WaveLast

schemes:
  WaveLast:
    build:
      targets:
        WaveLast: all
        WaveLastTests: [test]
        WaveLastUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [WaveLast]
      targets:
        - name: WaveLastTests
        - name: WaveLastUITests
    run:
      config: Debug
    archive:
      config: Release
